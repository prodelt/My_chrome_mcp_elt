# ChatGPT для комп'ютера / Codex: допишіть у кінець ~/.codex/config.toml
# (Windows: %USERPROFILE%\.codex\config.toml). Інші налаштування не змінюйте.
[mcp_servers.chrome-mine]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.12.0", "--autoConnect", "--no-usage-statistics"]
startup_timeout_sec = 60
